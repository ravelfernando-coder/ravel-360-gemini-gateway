name: Runtime Secret Presence Probe

on:
  push:
    branches:
      - supabase-external-backend-20260917
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_NAME: ${{ secrets.GEMINI_MODEL_NAME }}
      RAVEL_GATEWAY_SECRET: ${{ secrets.RAVEL_GATEWAY_SECRET }}
      RAVEL_DEFAULT_OWNER_ID: ${{ secrets.RAVEL_DEFAULT_OWNER_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          test -n "$DATABASE_URL" && echo "DATABASE_URL_CONFIGURED=true" || echo "DATABASE_URL_CONFIGURED=false"
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY_CONFIGURED=true" || echo "GEMINI_API_KEY_CONFIGURED=false"
          test -n "$GEMINI_MODEL_NAME" && echo "GEMINI_MODEL_NAME_CONFIGURED=true" || echo "GEMINI_MODEL_NAME_CONFIGURED=false"
          test -n "$RAVEL_GATEWAY_SECRET" && echo "RAVEL_GATEWAY_SECRET_CONFIGURED=true" || echo "RAVEL_GATEWAY_SECRET_CONFIGURED=false"
          test -n "$RAVEL_DEFAULT_OWNER_ID" && echo "RAVEL_DEFAULT_OWNER_ID_CONFIGURED=true" || echo "RAVEL_DEFAULT_OWNER_ID_CONFIGURED=false"
